# osx-arm64 builds and tests run on the Ventura (macOS 13) pool for both variants. Since patch 0027 MPS needs
# macOS 15 at runtime, so there the metal variant reports MPS unavailable and its tests check that path on CPU.
extra_labels_for_os:
  osx-arm64: [ventura]

task_timeout: 72000

build_env_vars:
  ANACONDA_ROCKET_ENABLE_PY315 : yes

