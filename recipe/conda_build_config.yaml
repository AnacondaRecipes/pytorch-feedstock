# PKG-12886 first pass — CPU-only scope, single python.
# TEMPORARY narrowing for fast CI feedback (5-6 builds vs the full ~30):
#   - gpu_variant restricted to cpu + osx-metal (no cuda entries)
#   - cuda_compiler_version removed entirely (only zip left is cpu/metal SDK pair)
#   - python restricted to 3.12
# Widen to full python matrix in the same PR after the initial matrix is green,
# then CUDA variants land in follow-up PRs (PKG-12885 linux-64 / linux-aarch64,
# PKG-12884 win-64) with their own local CBC that re-adds cuda_compiler_version.

python:
  - "3.12"

gpu_variant:
  - cpu                              # all platforms
  - metal                            # [(osx and arm64)]

# blas_impl is gated to [win] here because aggregate root CBC already defines
# `mkl # [(x86 or x86_64) and not osx]` + `openblas` for the other platforms.
# This block ADDS the Windows variants; non-Windows blas_impl is inherited
# from aggregate (mkl on linux-x86_64, openblas on aarch64/osx). Note: per
# conda-build's "local CBC REPLACES" rule the local entry would normally wipe
# the aggregate value, but because the selector `[win]` only fires on Windows,
# linux/osx see no local override and inherit normally.
blas_impl:                   # [win]
  - mkl                      # [win]
  - openblas                 # [win]
# Linux aarch64 needs gcc 15.2.0 due to a bug with 14.3 with vector instructions.
# Linux x86_64 needs gcc 14 due to CUDA 12.x compatibility (kept for parity
# with the CUDA follow-up PRs — no functional effect on CPU-only builds here).
c_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]
cxx_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]
# CONDA_BUILD_SYSROOT is defined in the base cbc.yaml, but it's reflected here so we can zip the keys and
# build Metal and CPU at the same time for osx-arm64. It'll need to be manually updated here if the base cbc is changed.
# This could be done using extend_keys instead, with a change to the base cbc.yaml.
# However there's currently a conda-forge bug that prevents this: https://github.com/conda/conda-build/issues/5048
MACOSX_SDK_VERSION:          # [(osx and arm64)]
  - 13.3                     # [(osx and arm64)]
  - 14.5                     # [(osx and arm64)]
CONDA_BUILD_SYSROOT:         # [(osx and arm64)]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX13.3.sdk  # [(osx and arm64)]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX14.5.sdk  # [(osx and arm64)]
# osx-arm64: zip gpu_variant with the two SDK keys (cpu↔13.3, metal↔14.5).
# The win/linux zip (gpu_variant × cuda_compiler_version) is dropped in this
# CPU-only pass — no cuda_compiler_version key exists to zip against.
zip_keys:
  -                              # [(osx and arm64)]
    - gpu_variant                # [(osx and arm64)]
    - MACOSX_SDK_VERSION         # [(osx and arm64)]
    - CONDA_BUILD_SYSROOT        # [(osx and arm64)]
# megabuild is disabled as our CI runners work on each python version separately.
megabuild:
- false
