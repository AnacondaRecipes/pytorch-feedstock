# pytorch unified CBC — shared byte-identical across the 3 split PRs (CPU+metal,
# CUDA 12.9, CUDA 13.x); meta.yaml differs only in the top-level `build.skip`
# line, which picks each PR's variant subset. Python inherits the aggregate matrix.
#
# CBC layout notes:
#   - gpu_variant is zipped with cuda_compiler_version on win/linux (so the CPU
#     variant doesn't duplicate across CUDA versions) and zipped with MACOSX_SDK
#     / CONDA_BUILD_SYSROOT on osx-arm64 (so CPU and Metal builds get separate
#     SDKs). Build strings key off the literal cpu/metal/cuda values.
#   - The repeated `cuda` entries in gpu_variant are intentional (NOT a typo).
#     They pair row-wise with cuda_compiler_version via the zip_keys block at
#     the bottom; each row's selector picks the platforms that build that CUDA
#     version (linux-aarch64 builds 13.x only: CUDA 12.x requires gcc <15 but
#     aarch64 needs gcc 15.2.0).

gpu_variant:
  - cpu                              # all platforms
  - metal                            # [(osx and arm64)]
  # The x86 cuda rows (12.9 / 13.0) stay gated to x86_64. win-arm64 gets its
  # own cuda row: CUDA 13.4 is the only Windows-on-ARM toolkit on pkgs/main
  # (PKG-17783; needs cudnn 9.26 win-arm64 + magma PKG-18376).
  - cuda                             # [(win and x86_64) or (linux and x86_64)]
  - cuda                             # [(win and x86_64) or linux]
  - cuda                             # [win and arm64]

# Upstream PyTorch 2.15 releases CUDA 13.0/13.2/13.4 wheels (CUDA_ARCHES in
# .github/scripts/generate_binary_build_matrix.py; 12.x left the release matrix).
# This recipe builds 12.9 and 13.0 on x86_64, 13.0 on linux-aarch64 and 13.4 on
# win-arm64. pkgs/main also has cuda-nvcc 13.1-13.4 for x86_64; moving to one of
# them is a separate change. aarch64 only supports CUDA 13.x (CUDA 12.x requires
# gcc <15, but aarch64 needs gcc 15.2.0). "none" pairs with gpu_variant=cpu/metal under
# zip_keys; the recipe ignores cuda_compiler_version for non-CUDA variants but
# the key must align lengthwise.
cuda_compiler_version:
  - none                             # cpu
  - none                             # [(osx and arm64)]  # metal pair
  - 12.9                             # [(win and x86_64) or (linux and x86_64)]
  - 13.0                             # [(win and x86_64) or linux]
  - 13.4                             # [win and arm64]

# blas_impl is gated to [win] here because aggregate root CBC already defines
# `mkl # [(x86 or x86_64) and not osx]` + `openblas` for the other platforms.
# This block ADDS the Windows variants; non-Windows blas_impl is inherited
# from aggregate (mkl on linux-x86_64, openblas on aarch64/osx). Per
# conda-build's "local CBC REPLACES" rule the local entry would normally wipe
# the aggregate value, but because the selector `[win]` only fires on Windows,
# linux/osx see no local override and inherit normally.
blas_impl:                   # [win]
  # mkl is x86-only; win-arm64 gets openblas only (0.3.31 _5 on pkgs/main).
  - mkl                      # [win and x86_64]
  - openblas                 # [win]

# Linux aarch64 needs gcc 15.2.0 due to a bug with 14.3 with vector instructions.
# Linux x86_64 needs gcc 14 due to CUDA 12.x compatibility.
c_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]
cxx_compiler_version:
  - 15.2.0                   # [linux and aarch64]
  - 14                       # [linux and x86_64]

# CONDA_BUILD_SYSROOT is defined in the base cbc.yaml, but it's reflected here so we can zip the keys and
# build GPU and CPU at the same time for osx-arm64. It'll need to be manually updated here if the base cbc is changed.
# This could be done using extend_keys instead, with a change to the base cbc.yaml.
# However there's currently a conda-forge bug that prevents this: https://github.com/conda/conda-build/issues/5048
# metal needs SDK >=15: 2.15 dropped its macOS-14 shim and uses macOS 15 MPS APIs
# unguarded (pytorch#199261). 15.2 is the newest CLT SDK on the PBP osx-arm64 workers.
MACOSX_SDK_VERSION:          # [(osx and arm64)]
  - 13.3                     # [(osx and arm64)]
  - 15.2                     # [(osx and arm64)]
CONDA_BUILD_SYSROOT:         # [(osx and arm64)]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX13.3.sdk  # [(osx and arm64)]
  - /Library/Developer/CommandLineTools/SDKs/MacOSX15.2.sdk  # [(osx and arm64)]

# Two zip groups, gated by platform so the shared `gpu_variant` key doesn't conflict:
#   - osx-arm64: zip gpu_variant with the two SDK keys (cpu↔13.3, metal↔15.2).
#   - win/linux: zip gpu_variant with cuda_compiler_version so the CPU variant
#                exists exactly once per platform (no Cartesian-product duplicates).
zip_keys:
  -                              # [(osx and arm64)]
    - gpu_variant                # [(osx and arm64)]
    - MACOSX_SDK_VERSION         # [(osx and arm64)]
    - CONDA_BUILD_SYSROOT        # [(osx and arm64)]
  -                              # [win or linux]
    - gpu_variant                # [win or linux]
    - cuda_compiler_version      # [win or linux]

# win-arm64 ships only eigen 5.x; the aggregate pin (eigen 3.3.7) has no
# win-arm64 build. The key-line selector makes this key exist only on
# win-arm64, so every other platform still inherits the aggregate pin
# (openblas-feedstock CBC-merge pattern). libprotobuf 7.35.1 / libabseil
# 20260526 now come from the aggregate CBC itself, so no override is needed.
# Note: pytorch 2.14's vendored eigen is post-3.4/master-era, so system
# eigen 5.0.1 is closer to upstream's tested combination than 3.3.7.
eigen:                       # [win and arm64]
  - 5.0.1                    # [win and arm64]

# megabuild is disabled as our CI runners work on each python version separately.
# win-arm64 is built off-CI over all Pythons in one conda-build run, so it uses the
# megabuild: libtorch is compiled once against megabuild_python and each pytorch
# output reuses that build tree (bld.bat refreshes the Python entries in CMakeCache).
megabuild:
- false                       # [not (win and arm64)]
- true                        # [win and arm64]
megabuild_python:
- 3.12                        # [win and arm64]
# The parent (libtorch) build gets a fixed NumPy too: the aggregate CBC zips numpy with
# python, and a per-Python NumPy would split the parent loop again (3.15 uses 2.5).
megabuild_numpy:
- 2.3                         # [win and arm64]
