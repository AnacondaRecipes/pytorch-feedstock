{% set version = "2.12.0" %}
# Set the RC number to build release candidates. Set to None otherwise.
{% set rc = None %}
{% set build = 0 %}


# Keep this in sync with the release
{% set smoke_test_commit = "4bd029011e0cef6881f439fb244d0369a8942e40" %}

# see https://github.com/pytorch/pytorch/blame/v{{ version }}/.ci/docker/ci_commit_pins/triton.txt
# 2.12 pins triton to release/3.7.x (commit b4e20bbe) — needs triton 3.7.0 in pkgs/main.
{% set triton = "3.7.0" %}

# Use a higher build number for the CUDA variant, to ensure that it's
# preferred by conda's solver, and it's preferentially
# installed where the platform supports it.
{% if gpu_variant != "cpu" %}
{% set build = build + 200 %}
{% endif %}

{% if blas_impl == "mkl" %}
{% set build = build + 100 %}
{% endif %}

{% if not (gpu_variant or "").startswith("cuda") %}
{% set cuda_major = 0 %}
{% else %}
{% set cuda_major = environ.get("cuda_compiler_version", "11.8").split(".")[0] | int %}
{% endif %}

package:
  name: libtorch
  version: {{ version }}

source:
  # Content-addressable source via git_url + git_rev: immune to GitHub asset
  # regeneration. The v2.12.0 release tarball was silently re-generated
  # between 2026-05-13 and 2026-05-15 (sha drift from 7cc1deb to 6a71b5f then
  # back to 7cc1deb again by 2026-05-20), breaking fresh PBP worker fetches.
  # conda-build recursively fetches submodules after clone, so pytorch's
  # third_party/* are pinned via .gitmodules to the SHAs the v2.12.0 tag
  # points at.
  - git_url: https://github.com/pytorch/pytorch.git
    git_rev: v{{ version }}{% if rc != None %}-rc{{ rc }}{% endif %}
    # NOTE: no git_depth pin. `git_depth: 1` makes conda-build do a shallow
    # `git clone --depth 1` (defaults to HEAD), then `git checkout v2.12.0`
    # fails because the tag isn't reachable in the shallow history. Full
    # clone (~430 MB) is fine — happens once per worker via src_cache.
    patches:
      - patches/0001-windows-FindMKL-add-library-suffix.patch                  # [win]
      - patches/0002-swap-openmp-search-precedence.patch                       # [blas_impl == "mkl"]
      - patches/0003-Force-usage-of-python-3-and-error-without-numpy.patch
      # https://github.com/pytorch/pytorch/issues/150918 - continue tests on failure due to flaky tests
      - patches/0007-continue-tests-on-failure.patch
      - patches/0008-add-missing-includes.patch
      - patches/0009-use-prefix-include-for-inductor.patch
      - patches/0011-remove-DESTINATION-lib-from-CMake-install-TARGETS-di.patch             # [win]
      - patches/0014-point-include-paths-to-PREFIX-include.patch
      - patches/0015-point-lib-paths-to-PREFIX-lib.patch
      - patches/0018-Add-USE_SYSTEM-options-for-KLEIDI-CUDNN_FRONTEND-CUT.patch
      - patches/0021-fix-onednn-cuda-include.patch
      - patches/0022-force-bundled-mkldnn.patch
      - patches/0023-remove-conftest-extra-param.patch
      - patches/0024-Allow-fbgemm_genai-to-be-assigned-to-a-Ninja-job-pool.patch    # [linux and gpu_variant == "cuda"]
  - url: https://raw.githubusercontent.com/pytorch/pytorch/{{ smoke_test_commit }}/.ci/pytorch/smoke_test/smoke_test.py
    folder: smoke_test
  # check_wheel_tags.py is a sibling helper imported by smoke_test.py since the
  # 2.12 release (smoke_test.py:13 `from check_wheel_tags import …`). Without
  # this file the win-64 pytorch test command `python ./smoke_test/smoke_test.py
  # --package torchonly` fails with ModuleNotFoundError. The helper's runtime
  # calls fall back to a "soft warn" mode when PYTORCH_FINAL_PACKAGE_DIR isn't
  # set, so it works fine on conda-installed packages.
  - url: https://raw.githubusercontent.com/pytorch/pytorch/{{ smoke_test_commit }}/.ci/pytorch/smoke_test/check_wheel_tags.py
    folder: smoke_test
  # NOTE: .gitignore (required by upstream's `setup.py clean`) now comes
  # from the git_url checkout above — no separate download needed.

build:
  number: {{ build }}
  # Platform coverage at py3.14: linux-64 (cpu/cuda12.9/cuda13.0 × openblas/mkl
  # = 6), linux-aarch64 (cpu + cuda13.0 × openblas = 2), osx-arm64 (cpu only;
  # metal blocked, see below), win-64 (same 6 as linux-64). Total 15 builds.
  # mkl is x86_64-only (aggregate CBC gates it via `(x86 or x86_64) and not
  # osx`), so aarch64/osx stay on openblas automatically.
  #
  # linux-aarch64 + CUDA: deliberately ships without triton per PKG-13219
  # ("we will deliver without triton on linux-aarch64. We don't want this
  # to be blocking."). triton is gated to `linux and x86_64` in the run-deps
  # below (and so is the inductor test block). 2.11 shipped aarch64 CUDA the
  # same way — torch.compile inductor backend is the only feature lost.
  # win-64 + CUDA 12.9: cuda-cccl_win-64 12.9.27 ships a libcudacxx
  # clusterlaunchcontrol.h header with an asm-constraint bug on MSVC
  # ("asm operand type size(4) does not match constraint 'l'"). Worked
  # around inline by bld.bat (sed-replace long2 → longlong2 in the affected
  # header); no skip needed.
  # Per-Python skip: rotates each CI round. py3.13 was validated in graph
  # 024f17c9 (round 1); this round runs py3.14 to catch deps that haven't
  # been packaged for the new ABI. Flip back to a multi-py matrix (drop the
  # skip entirely) before merging to master.
  skip: true  # [py != 314]
  # osx-arm64 metal: re-enabled after SIR-3273 root cause fix in build.sh
  # (export SDKROOT + CMAKE_ARGS sed for 12.1 → MACOSX_SDK_VERSION).
  # Verified on PR #103 debug graph 935c2593-eeac-41a8-8683-ec3e80f48478.
  string: gpu_cuda{{ cuda_compiler_version | replace('.', '') }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  string: gpu_mps_h{{PKG_HASH}}_{{ PKG_BUILDNUM }}                                                   # [gpu_variant == "metal"]
  string: cpu_{{ blas_impl }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                     # [gpu_variant == "cpu"]
  detect_binary_files_with_prefix: false
  run_exports:
    - {{ pin_subpackage('libtorch', max_pin='x.x') }}
  ignore_run_exports_from:
    - python *
    - numpy *
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  ignore_run_exports:
    - python *                               
    - numpy *                               

requirements:
  # Keep this list synchronized (except for python*, numpy*) in outputs
  # We use python to build libtorch as well because it is easier
  build:
    # When you change megabuild_python, change it in build.sh as well
    - python {{ megabuild_python }}          # [megabuild and build_platform != target_platform]
    - python                                 # [not megabuild and build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy  *                               # [megabuild and build_platform != target_platform]
    - numpy                                  # [not megabuild and build_platform != target_platform]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}                    # [(gpu_variant or "").startswith("cuda")]
    - cuda-version {{ cuda_compiler_version }}  # [(gpu_variant or "").startswith("cuda")]
    - nvtx-c                                 # [(gpu_variant or "").startswith("cuda") and build_platform != target_platform]
    {% if cuda_major >= 12 %}
    # pytorch 2.12 cmake/public/cuda.cmake:165 link-resolves CUDA::cuda_driver
    # at configure time; need the driver stub in build for native too, not
    # just cross-compile.
    - cuda-driver-dev                        # [linux and (gpu_variant or "").startswith("cuda")]
    - cuda-cudart-dev                        # [build_platform != target_platform]
    - cuda-cupti-dev                         # [build_platform != target_platform]
    - cuda-nvrtc-dev                         # [build_platform != target_platform]
    - cuda-nvtx-dev                          # [build_platform != target_platform]
    - cuda-nvml-dev                          # [build_platform != target_platform]
    - cuda-profiler-api                      # [build_platform != target_platform]
    - libcublas-dev                          # [build_platform != target_platform]
    - libcufile-dev                          # [linux and build_platform != target_platform]
    - libcufft-dev                           # [build_platform != target_platform]
    - libcurand-dev                          # [build_platform != target_platform]
    - libcusolver-dev                        # [build_platform != target_platform]
    - libcusparse-dev                        # [build_platform != target_platform]
    {% endif %}
    # git is needed on ALL platforms because the source uses git_url +
    # git_rev (content-addressable; immune to GitHub asset regeneration).
    - git
    # libgomp has a strong run_export of _openmp_mutex *_gnu; on linux+mkl
    # that conflicts with intel-openmp's _openmp_mutex *_intel in host.
    # Scope libgomp to non-mkl linux only — intel-openmp provides openmp
    # runtime for the mkl variant.
    - libgomp   # [linux and blas_impl != "mkl"]
    # This has a strong run_export so we don't need to put it in `host` or `run`
    # We use llvm-openmp for openblas variants on osx.
    - llvm-openmp 17              # [osx and not (blas_impl == "mkl")]
    - libuv     # [win]
    - cmake
    - ninja-base
    - libabseil
    # Keep libprotobuf here so that a compatibile version
    # of protobuf is installed between build and host
    - libprotobuf
    - make      # [linux]
  host:
    # GPU requirements
    - cuda-version {{ cuda_compiler_version }} # [(gpu_variant or "").startswith("cuda")]
    - nvtx-c                                   # [(gpu_variant or "").startswith("cuda")]
    {% if cuda_major < 13 %}
    - cudnn 9.17.0.29                          # [(gpu_variant or "").startswith("cuda")]
    - nccl 2.29.3.1                            # [(gpu_variant or "").startswith("cuda") and linux]
    {% else %}    
    - cudnn                  # [(gpu_variant or "").startswith("cuda")]
    - nccl                   # [(gpu_variant or "").startswith("cuda") and linux]
    {% endif %}
    {% if cuda_major >= 12 %}
    # cuda-driver-dev ships libcuda.so stub under targets/<arch>-linux/lib/stubs/;
    # cmake's FindCUDAToolkit searches under the host prefix, so the driver
    # stub must be in host (not just build) for pytorch 2.12 cuda.cmake to
    # resolve CUDA::cuda_driver.
    - cuda-driver-dev                        # [linux]
    - cuda-cudart-dev
    - cuda-cupti-dev
    - cuda-nvrtc-dev
    - cuda-nvtx-dev
    - cuda-nvml-dev
    - cuda-profiler-api
    - libcublas-dev
    - libcufile-dev                          # [linux]
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - cuda-cupti {{ cuda_compiler_version }}
    {% endif %}
    # other requirements
    - python {{megabuild_python}}  # [megabuild]
    - python       # [not megabuild]
    - numpy >=1.26.0,<3.0.0
    - pip
    # upstream requirements-build.txt: setuptools>=70.1.0,<82
    - setuptools >=70.1.0,<82
    - wheel
    - pyyaml
    - requests
    - six
    - mkl-devel {{ mkl }}          # [blas_impl == "mkl"]
    - openblas-devel {{ openblas }}   # [blas_impl == "openblas"]
    # We pull in the same versions of mkl and intel-openmp: intel aligns the versions
    # We use intel-openmp for all mkl variants.
    # For openblas on win and linux, we don't specify any openmp implementation; it comes from the compiler.
    - intel-openmp {{ mkl }}         # [blas_impl == "mkl"]
    - llvm-openmp 17              # [osx and not (blas_impl == "mkl")]
    - libabseil {{ libabseil }}
    - libprotobuf {{ libprotobuf }}
    # sleef: scoped out of linux+mkl. AR sleef pins `_openmp_mutex *_gnu`
    # as a hard depends, which conflicts with intel-openmp's `*_intel` in
    # MKL builds. On linux+mkl, pytorch falls back to its bundled sleef
    # (third_party/sleef) via USE_SYSTEM_SLEEF=0 in build.sh — that build
    # picks up intel-openmp from the build env and stays consistent with
    # Eric Lundby's "MKL links intel only" intent. Other platforms keep
    # the system sleef. win-64 sleef does not pin openmp mutex.
    - sleef 3.5.1   # [not (linux and blas_impl == "mkl")]
    - libuv
    - pkg-config  # [unix]
    # upstream requirements-build.txt: typing-extensions>=4.15.0
    - typing_extensions >=4.15.0
    - packaging
    # upstream pytorch 2.12 vendors pybind11 3.0.1 (third_party submodule).
    # ABI-compatible up to 3.0.x; cap at 4.0 for future safety. pybind11-abi
    # explicitly included to pin the ABI version (PKG-13552; mamba-feedstock pattern).
    - pybind11 >=3.0.1,<4
    - pybind11-abi
    - eigen {{ eigen }}
    - zlib {{ zlib }}
    - fmt {{ fmt }}
  # satisfy overlinking checks
  run:
    - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl"]
    - libuv                                  # [win]
    - {{ pin_compatible('magma') }}          # [(gpu_variant or "").startswith("cuda")]
    - {{ pin_compatible('libcudnn') }}          # [(gpu_variant or "").startswith("cuda")]
    - __cuda                                    # [(gpu_variant or "").startswith("cuda")] 

# these tests are for the libtorch output below, but due to
# a particularity of conda-build, that output is defined in
# the global build stage, including tests
test:
  requires:
    # cmake needs a compiler to run package detection, see
    # https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
    - {{ compiler('cxx') }}
    # PKG-14712: osx-arm64 ld64/cctools test-env clobber breaks C++ stdlib
    # header lookup (cstdlib/iostream missing). Pin the c-stdlib provider
    # explicitly so the test env always has a consistent toolchain.
    - {{ stdlib('c') }}
    # for CMake config to find cuda & nvrtc
    - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
    - cuda-nvcc ={{ cuda_compiler_version }}     # [(gpu_variant or "").startswith("cuda")]
    - cuda-nvrtc-dev            # [(gpu_variant or "").startswith("cuda")]
    - cmake
    - ninja
    - pkg-config
  files:
    - cmake_test/
  commands:
    # libraries
    {% for each_lib in [ 'libc10', 'libshm', 'libtorch', 'libtorch_cpu', 'libtorch_global_deps'] %}
    - test -f $PREFIX/lib/{{ each_lib }}.so     # [linux]
    - test -f $PREFIX/lib/{{ each_lib }}.dylib  # [osx]
    {% endfor %}
    {% for each_lib in ['libc10_cuda', 'libcaffe2_nvrtc', 'libtorch_cuda', 'libtorch_cuda_linalg'] %}
    - test -f $PREFIX/lib/{{ each_lib }}.so     # [linux and (gpu_variant or "").startswith("cuda")]
    {% endfor %}
        # test integrity of CMake metadata
    - cd cmake_test
    - cmake -GNinja -DCMAKE_CXX_STANDARD=17 $CMAKE_ARGS .   # [unix]
    - cmake -GNinja -DCMAKE_CXX_STANDARD=17 %CMAKE_ARGS% .  # [win]
    # Verify dnnl.dll links Intel OpenMP (libiomp5md), not MSVC OpenMP
    # (vcomp). Eric Lundby PR #100 patches cmake/Dependencies.cmake to
    # force this; these asserts catch future regressions.
    - dumpbin /dependents "%PREFIX%\Library\bin\dnnl.dll" | findstr /i libiomp5md            # [win and blas_impl == "mkl"]
    - dumpbin /dependents "%PREFIX%\Library\bin\dnnl.dll" | findstr /i vcomp && exit /b 1 || exit /b 0  # [win and blas_impl == "mkl"]

outputs:
  - name: libtorch
    # Workaround for a win-64 conda-build wrapping change post-Taskcluster 95.x
    # AMI rebuild (SIR-3210 / SIR-3264): when libtorch has no per-output script,
    # conda-build inlines the top-level bld.bat into a generated IF-block
    # wrapper instead of calling it as its own batch process. Inside that
    # wrapper, CBC variant variables like %blas_impl% are empty, so bld.bat's
    # BLAS check fails and the libtorch .conda artifact ships with 0 files.
    # Giving libtorch its own per-output script (mirroring pytorch's
    # build_pytorch.bat -> bld.bat pattern) forces a separate batch invocation
    # where %blas_impl% is correctly populated. unix is unaffected; the
    # top-level build.sh continues to run for the libtorch output there.
    script: build_libtorch.bat  # [win]
    build:
      missing_dso_whitelist:
        # The are dynamically loaded from %SP_DIR%\torch\lib\
        - "**/asmjit.dll"             # [win]
        - "**/c10.dll"                # [win]
        - "**/fbgemm.dll"             # [win]
        - "**/shm.dll"                # [win]
        - "**/torch_cpu.dll"          # [win]
        - "**/torch_python.dll"       # [win]
        # libcuda.so is the cuda driver API library and is a system library.
        - "**/libcuda.so*"            # [(gpu_variant or "").startswith("cuda")]
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
      overlinking_ignore_patterns:
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]

  - name: pytorch
    build:
      string: gpu_cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
      string: gpu_mps_py{{ CONDA_PY }}h{{PKG_HASH}}_{{ PKG_BUILDNUM }}                                                   # [gpu_variant == "metal"]
      string: cpu_{{ blas_impl }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                     # [gpu_variant == "cpu"]
      entry_points:
        - torchrun = torch.distributed.run:main
      ignore_run_exports:             # [osx]
        - libuv                       # [osx]
      missing_dso_whitelist:
        # The are dynamically loaded from %SP_DIR%\torch\lib\
        - "**/asmjit.dll"             # [win]
        - "**/c10.dll"                # [win]
        - "**/c10_cuda.dll"           # [win]
        - "**/fbgemm.dll"             # [win]
        - "**/shm.dll"                # [win]
        - "**/torch_cpu.dll"          # [win]
        - "**/torch_cuda.dll"         # [win]
        - "**/torch_python.dll"       # [win]
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
        - "**/libtorch_python.so*"    # [aarch64]
      overlinking_ignore_patterns:
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
        - "**/libtorch_python.so*"    # [aarch64]
      detect_binary_files_with_prefix: false
      run_exports:
        - {{ pin_subpackage('pytorch', max_pin='x.x') }}
        - {{ pin_subpackage('libtorch', max_pin='x.x') }}
    script: build_pytorch.sh   # [unix]
    script: build_pytorch.bat  # [win]
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - numpy                                  # [build_platform != target_platform]
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}                 # [(gpu_variant or "").startswith("cuda")]
        - nvtx-c                                 # [(gpu_variant or "").startswith("cuda") and build_platform != target_platform]
        {% if cuda_major >= 12 %}
        # pytorch 2.12 cmake/public/cuda.cmake:165 link-resolves CUDA::cuda_driver
        # at configure time; need the driver stub in build for native too.
        - cuda-driver-dev                        # [linux and (gpu_variant or "").startswith("cuda")]
        - cuda-cudart-dev                        # [build_platform != target_platform]
        - cuda-cupti-dev                         # [build_platform != target_platform]
        - cuda-nvrtc-dev                         # [build_platform != target_platform]
        - cuda-nvtx-dev                          # [build_platform != target_platform]
        - cuda-nvml-dev                          # [build_platform != target_platform]
        - cuda-profiler-api                      # [build_platform != target_platform]
        - libcublas-dev                          # [build_platform != target_platform]
        - libcufile-dev                          # [linux and build_platform != target_platform]
        - libcufft-dev                           # [build_platform != target_platform]
        - libcurand-dev                          # [build_platform != target_platform]
        - libcusolver-dev                        # [build_platform != target_platform]
        - libcusparse-dev                        # [build_platform != target_platform]
        {% endif %}
        # git is needed on ALL platforms — see libtorch build section above.
        - git
        # See libtorch build section above for the openmp-mutex rationale —
        # libgomp's _openmp_mutex *_gnu run_export conflicts with intel-openmp's
        # _openmp_mutex *_intel on linux+mkl.
        - libgomp   # [linux and blas_impl != "mkl"]
        # This has a strong run_export so we don't need to put it in `host` or `run`
        # We use llvm-openmp for openblas variants on osx.
        - llvm-openmp 17             # [osx and not (blas_impl == "mkl")]
        - cmake
        - ninja-base
        # Keep libprotobuf here so that a compatibile version
        # of protobuf is installed between build and host
        - libprotobuf
        - make      # [linux]
      host:
        # GPU requirements
        {% if cuda_major < 13 %}
        - cudnn 9.17.0.29                 # [(gpu_variant or "").startswith("cuda")]
        - nccl 2.29.3.1                   # [(gpu_variant or "").startswith("cuda") and linux]
        {% else %}
        - cudnn                           # [(gpu_variant or "").startswith("cuda")]
        - nccl                            # [(gpu_variant or "").startswith("cuda") and linux]
        {% endif %}
        # pytorch 2.12 BatchLinearAlgebra.cpp:55-57 #errors out when
        # MAGMA_VERSION_MINOR>=10 (deliberate guard — their AT_MAGMA_VERSION
        # macro packs minor*10 and overflows). MAGMA 2.10.0 is on pkgs/main;
        # cap to <2.10 until pytorch upstream rewrites the version macro.
        - magma <2.10                     # [(gpu_variant or "").startswith("cuda")]
        - nvtx-c                          # [(gpu_variant or "").startswith("cuda")]
        {% if cuda_major >= 12 %}
        # pytorch 2.12 cmake/public/cuda.cmake:165 needs CUDA::cuda_driver at
        # configure time; ship the driver stub on all linux CUDA hosts.
        - cuda-driver-dev                 # [linux and (gpu_variant or "").startswith("cuda")]
        - cuda-cudart-dev
        - cuda-cupti-dev
        - cuda-nvrtc-dev
        - cuda-nvtx-dev
        - cuda-nvml-dev
        - cuda-profiler-api
        - libcublas-dev
        - libcufile-dev                   # [linux]
        - libcufft-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - cuda-cupti {{ cuda_compiler_version }}
        {% endif %}
        # other requirements
        - python
        - numpy >=1.26.0,<3.0.0
        - pip
        # upstream requirements-build.txt: setuptools>=70.1.0,<82
        - setuptools >=70.1.0,<82
        - wheel
        - pyyaml
        - requests
        - six
        - mkl-devel {{ mkl }}             # [blas_impl == "mkl"]
        - openblas-devel {{ openblas }}   # [blas_impl == "openblas"]
        # We pull in the same versions of mkl and intel-openmp: intel aligns the versions
        # We use intel-openmp for all mkl variants.
        # For openblas on win and linux, we don't specify any openmp implementation; it comes from the compiler.
        - intel-openmp {{ mkl }}      # [blas_impl == "mkl"]
        - llvm-openmp 17              # [osx and not (blas_impl == "mkl")]
        - libabseil
        - libprotobuf {{ libprotobuf }}
        # sleef: see libtorch host above. Scoped out of linux+mkl;
        # pytorch falls back to bundled sleef via USE_SYSTEM_SLEEF=0.
        - sleef 3.5.1   # [not (linux and blas_impl == "mkl")]
        - libuv
        - pkg-config  # [unix]
        # upstream requirements-build.txt: typing-extensions>=4.15.0
        - typing_extensions >=4.15.0
        - packaging
        - {{ pin_subpackage('libtorch', exact=True) }}
        # upstream pytorch 2.12 vendors pybind11 3.0.1; ABI-compatible up to 3.0.x.
        # pybind11-abi explicit (PKG-13552, mamba pattern).
        - pybind11 >=3.0.1,<4
        - pybind11-abi
        - eigen {{ eigen }}
        - zlib {{ zlib }}
        - fmt {{ fmt }}
      run:
        - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl"]
        - llvm-openmp                            # [osx and not (blas_impl == "mkl")]
        # GPU requirements without run_exports
        - {{ pin_compatible('libcudnn') }}          # [(gpu_variant or "").startswith("cuda")]
        # other requirements
        - python
        - numpy >=1.24.0,<3.0.0
        - typing_extensions >=4.10.0
        # To stop the compiler pulling in an openmp implementation itself (although I'm not sure this mutex works anyway)
        - _openmp_mutex                                       # [linux]
        - {{ pin_compatible('magma') }}                       # [(gpu_variant or "").startswith("cuda")]
        # skip to 1.13.3 to avoid test failures on Windows and mac - align with 2.7.0 release requirement
        # https://github.com/pytorch/pytorch/pull/133235
        - sympy>=1.13.3
        - filelock
        - jinja2
        - networkx
        - optree >=0.13.0
        - nomkl                 # [blas_impl != "mkl"]
        - fsspec
        # Required to support torch.compile. This is tested in smoke_test.py, which is required to pass
        - triton =={{ triton }}       # [(gpu_variant or "").startswith("cuda") and (linux and x86_64)]
        - {{ pin_subpackage('libtorch', exact=True) }}
        # upstream requirements-build.txt: setuptools>=70.1.0,<82
        - setuptools >=70.1.0,<82
      run_constrained:
        # current intel-openmp builds are incompatible with llvm-openmp on osx-64
        - llvm-openmp <0a0                # [(blas_impl == "mkl") and (osx and x86_64)]  

    test:
      requires:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        # PKG-14712: pin the c-stdlib provider so osx-arm64 test env has
        # consistent C++ stdlib headers (cstdlib/iostream) — works around
        # ld64/cctools clobber observed during pytorch QS env testing.
        - {{ stdlib('c') }}
        - boto3
        - hypothesis
        # SciPy is needed by test_ops.py::test_numpy_ref_* on ALL platforms
        # (not just win+cuda as previously assumed). Failure on linux-64 +
        # CUDA:
        #   test_ops.py::TestCommonCUDA::test_numpy_ref_nn_functional_
        #   pdist_cuda_float64 - Exception: name 'scipy' is not defined
        - scipy
        - tabulate
        - pydot
        - mock  # [linux]
        - pip
        - expecttest
        # unittest-xml-reporting provides xmlrunner
        - unittest-xml-reporting
        - pytest
        - pytest-rerunfailures
        - pytest-flakefinder
        - pytest-xdist
        # Needed for test_autograd.py::test_multi_grad_all_hooks
        # (torch.utils.cpp_extension.load_inline requires ninja).
        - ninja
        # Needed for test_autograd.py
        - pybind11 >=3.0.1,<4
        # the inductor "test_aoti_eager..." tests require objcopy
        - binutils  # [linux]
        # Triton JIT links cuda_utils.c against libcuda; use driver stubs from the env (no system /lib64 driver in many builders)
        - cuda-driver-dev  # [linux and (gpu_variant or "").startswith("cuda")]
        # Inductor/triton JIT-builds cuda_utils.c and needs cuda.h under PREFIX/targets/*/include (see triton runtime/build.py).
        # cuda-nvcc alone does not populate that tree in the test env; cuda-cudart-dev does (same as global host: for CUDA 12+).
        - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
        - cuda-version {{ cuda_compiler_version }}   # [(gpu_variant or "").startswith("cuda")]
        - cuda-nvcc ={{ cuda_compiler_version }}     # [(gpu_variant or "").startswith("cuda")]
        {% if cuda_major >= 12 %}
        - cuda-cudart-dev           # [(gpu_variant or "").startswith("cuda")]
        {% endif %}
        - cuda-nvrtc-dev            # [(gpu_variant or "").startswith("cuda")]
      imports:
        - torch
      source_files:
        - test
        # tools/ is needed to optimise test run
        # as of pytorch=2.0.0, there is a bug when trying to run tests without the tools
        - tools
        - smoke_test
        # See files needed: https://github.com/pytorch/pytorch/blob/main/test/test_ops.py#350-L351
        - aten/src/ATen/native
      commands:
        # the smoke test script takes a bunch of env variables, defined below
        - set MATRIX_GPU_ARCH_VERSION="{{ '.'.join(cuda_compiler_version.split('.')[:2]) }}"    # [(gpu_variant == "cuda") and (win)]
        - set MATRIX_GPU_ARCH_TYPE="cuda"                                                       # [(gpu_variant or "").startswith("cuda") and (win)]
        - set MATRIX_GPU_ARCH_VERSION="none"                                                    # [(gpu_variant == "cpu") and (win)]
        - set MATRIX_GPU_ARCH_TYPE="none"                                                       # [(gpu_variant == "cpu") and (win)]
        - set MATRIX_CHANNEL="defaults"                                                         # [win]
        - set MATRIX_STABLE_VERSION={{ version }}                                               # [win]
        - set MATRIX_PACKAGE_TYPE="conda"                                                       # [win]
        - set TARGET_OS="windows"                                                               # [win]
        - set OMP_NUM_THREADS=4                                                                 # [win]
        - export MATRIX_GPU_ARCH_VERSION="{{ '.'.join(cuda_compiler_version.split('.')[:2]) }}" # [(gpu_variant == "cuda") and linux]
        - export MATRIX_GPU_ARCH_VERSION="{{ MACOSX_SDK_VERSION }}"                             # [(gpu_variant == "metal")]
        - export MATRIX_GPU_ARCH_TYPE="cuda"                                                    # [(gpu_variant or "").startswith("cuda") and linux]
        - export MATRIX_GPU_ARCH_TYPE="mps"                                                     # [(gpu_variant == "metal")]
        - export MATRIX_GPU_ARCH_VERSION="none"                                                 # [(gpu_variant == "cpu") and (not win)]
        - export MATRIX_GPU_ARCH_TYPE="none"                                                    # [(gpu_variant == "cpu") and (not win)]
        - export MATRIX_CHANNEL="defaults"                                                      # [not win]
        - export MATRIX_STABLE_VERSION="{{ version }}"                                          # [not win]
        - export MATRIX_PACKAGE_TYPE="conda"                                                    # [not win]
        - export TARGET_OS="linux"                                                              # [linux]
        - export TARGET_OS="macos-arm64"                                                        # [(osx and arm64)]
        - export TARGET_OS="macos-x86_64"                                                       # [(osx and x86_64)]
        - export OMP_NUM_THREADS=4                                                              # [not win]
        # Smoke test is not supported on Windows with CUDA
        - python ./smoke_test/smoke_test.py --package torchonly  # [not (gpu_variant or "").startswith("cuda") and win]
        # We seem to have individual platform-specific test failures or flaky
        # tests, but the majority of tests pass.
        # Note that the `|| true` expression will make the build continue even if the whole script falls over completely
        # (for example, in the case of missing imports). There doesn't seem to be a way of making a script exception return
        # non-zero but failing tests return zero.
        # ------------------------------------------------------------------------------------------------
        # Flaky complex linear-algebra cases (see run_test_core_k); https://github.com/pytorch/pytorch/issues/150918
        {% set run_test_core_k = "not (complex and (linalg_vecdot or dot or vdot))" %}
        # linux-aarch64 CUDA packages are built with TORCH_CUDA_ARCH_LIST starting at sm_80 (see recipe/build.sh;
        # upstream aarch wheels omit <8.0 and 8.6). CI GPUs below sm_80 (e.g. some Jetson) hit
        # cudaErrorNoKernelImageForDevice loading kernels. TestBwdGradientsCUDA / test_inplace_gradgrad* fail from that
        # mismatch, not from functional PyTorch bugs on supported datacenter GPUs; exclude them only on this matrix.
        {% set run_test_core_k_aarch64_cuda = run_test_core_k ~ " and not inplace_gradgrad" %}
        - python ./test/run_test.py --core --continue-through-error -k "{{ run_test_core_k }}" || true # [not win and not (linux and aarch64 and (gpu_variant or "").startswith("cuda"))]
        - python ./test/run_test.py --core --continue-through-error -k "{{ run_test_core_k_aarch64_cuda }}" || true # [linux and aarch64 and (gpu_variant or "").startswith("cuda")]
        # lgamma or mvlgamma or multigammaln or gammaln all have these issues on a combination of Intel Xeon processors and Windows Server differences.
        # enabling these tests on windows will cause numerical differences in the test suite.
        # This is a non-deterministic issue where between 80-110 tests fail. This has been observed between Pytorch 2.5 and above.
        - python ./test/run_test.py --core --continue-through-error -k "not ((complex and (linalg_vecdot or dot or vdot)) or lgamma or mvlgamma or multigammaln or gammaln)" || exit 0 # [win]
        # The inductor tests test the torch.compile backend. Using the options below avoids running distributed tests,
        # which would be run if we used the --inductor option. (Distributed tests would only be correctly run on a multi-gpu test platform,
        # which we don't have.)
        # These following tests have been disbaled due to GPU architecture needing to be very new on CI. And the others are disbled due to https://github.com/conda-forge/pytorch-cpu-feedstock/issues/380
        # this also aligns with their meta.yaml testing strategy
        {% set inductor_skips = "test_isinf_cuda" %}
        {% set inductor_skips = inductor_skips ~ " or test_donated_buffer_inplace_gpt" %}
        {% set inductor_skips = inductor_skips ~ " or test_sdpa_inference_mode_aot_compile" %}
        # "Attempt to trace generator" - upstream Dynamo bug
        {% set inductor_skips = inductor_skips ~ " or test_lite_regional_compile_flex_attention_cuda" %}
        - python test/run_test.py -i inductor/test_torchinductor.py --continue-through-error -k "not ({{ inductor_skips }})" || true   # [(gpu_variant or "").startswith("cuda") and (linux and x86_64)]
        - python ./test/run_test.py --mps --continue-through-error || true                                           # [(gpu_variant == "metal")]
        # Run pip check so as to ensure that all pytorch packages are installed
        # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/24
        - pip check
        - python -c "import torch; print(torch.__version__)"
        # We have had issues with openmp .dylibs being doubly loaded in certain cases. These two tests catch those issues
        - python -c "import torch; import numpy"
        - python -c "import numpy; import torch"
        # distributed support is enabled by default on linux; for mac, we enable it manually in build.sh
        - python -c "import torch; assert torch.distributed.is_available()"        # [linux or osx]
        # mkldnn is set in build.sh for linux/non-cuda variants
        - python -c "import torch; assert torch.backends.mkldnn.m.is_available()"  # [linux and not (gpu_variant or "").startswith("cuda")]
        # Add debug for GPU tests
        - python -c "import torch; print('CUDA is_built:', torch.backends.cuda.is_built()); assert torch.backends.cuda.is_built()"                # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('CUDA is_available:', torch.cuda.is_available()); assert torch.cuda.is_available()"                      # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('cuDNN is_available:', torch.backends.cudnn.is_available()); assert torch.backends.cudnn.is_available()" # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('cuDNN enabled:', torch.backends.cudnn.enabled); assert torch.backends.cudnn.enabled"                    # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; assert torch.backends.mps.is_built()"           # [(gpu_variant == "metal")]
        - python -c "import torch; torch.tensor(1).to('cpu').numpy(); print('numpy support enabled!!!')"
        - test -f $PREFIX/lib/libtorch_python${SHLIB_EXT}     # [unix]

  - name: pytorch-{{ "cpu" if gpu_variant == "cpu" else "gpu" }}
    requirements:
      run:
        - pytorch ={{ version }}={{ "cpu" if gpu_variant == "cpu" else "gpu" }}* # NB pinning exact=True will also pin to the python version
    test:
      imports:
        - torch

about:
  home: https://pytorch.org/
  dev_url: https://github.com/pytorch/pytorch
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - NOTICE
  summary: PyTorch is an optimized tensor library for deep learning using GPUs and CPUs.
  description: |
    PyTorch is a Python package that provides two high-level features:
      - Tensor computation (like NumPy) with strong GPU acceleration
      - Deep neural networks built on a tape-based autograd system
    You can reuse your favorite Python packages such as NumPy, SciPy, and Cython to extend PyTorch when needed.
  doc_url: https://pytorch.org/docs/

extra:
  skip-lints:
    - missing_tests
  recipe-maintainers:
    - hmaarrfk
    - sodre
    - benjaminrwilson
    - Tobias-Fischer
    - beckermr
    - danpetry