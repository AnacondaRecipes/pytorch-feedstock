{% set version = "2.15.0" %}
# Set the RC number to build release candidates. Set to None otherwise.
{% set rc = None %}
{% set build = 0 %}

# Single source of truth: the commit SHA the v{{ version }} tag points at.
# Drives BOTH the source git_rev AND the smoke_test fetches below — one SHA
# to bump per release, nothing to "conjure" separately.
# To resolve for a future release:
#   gh api repos/pytorch/pytorch/git/refs/tags/v<version> --jq '.object.sha'
# (de-reference annotated tags via .object.type == "tag" → /git/tags/<sha>.)
# PRE-RELEASE: v2.15.0 is not tagged yet; this is v2.15.0-rc8 (release/2.15 head).
# Swap to the v2.15.0 tag commit before merge.
{% set git_rev_sha = "4893744ac55687374648b56b653e2fa472757bea" %}
{% set smoke_test_commit = git_rev_sha %}

# see https://github.com/pytorch/pytorch/blame/v{{ version }}/.ci/docker/ci_commit_pins/triton.txt
# 2.15 pins triton commit aad2a60d (release/3.9.x, pre-v3.9.0 tag).
{% set triton = "3.9.0" %}

# GPU variants get +200 so the solver prefers them where the platform supports
# them; mkl gets +100 over openblas.
{% set build = build + (200 if gpu_variant != "cpu" else 0) + (100 if blas_impl == "mkl" else 0) %}
{% set cuda_major = (environ.get("cuda_compiler_version", "11.8").split(".")[0] | int) if (gpu_variant or "").startswith("cuda") else 0 %}

package:
  name: libtorch
  version: {{ version }}

source:
  # Content-addressable source pinned to the exact commit v{{ version }} points at.
  # Tags are mutable on GitHub — a retag would silently change our source —
  # so we pin the SHA, not the tag. This also sidesteps the release-tarball
  # regeneration that broke sha256-pinned fetches (asset re-generated several
  # times between 2026-05-13 and 2026-05-20). conda-build recursively fetches
  # submodules after clone, so third_party/* come from .gitmodules at this SHA.
  - git_url: https://github.com/pytorch/pytorch.git
    git_rev: {{ git_rev_sha }}   # v{{ version }} — see top-of-file derivation
    # NOTE: no git_depth pin. `git_depth: 1` makes conda-build do a shallow
    # `git clone --depth 1` (defaults to HEAD), then `git checkout v{{ version }}`
    # fails because the tag isn't reachable in the shallow history. Full
    # clone (~430 MB) is fine — happens once per worker via src_cache.
    patches:
      - patches/0001-windows-FindMKL-add-library-suffix.patch                  # [win]
      - patches/0002-swap-openmp-search-precedence.patch                       # [blas_impl == "mkl"]
      - patches/0003-Force-usage-of-python-3-and-error-without-numpy.patch
      # https://github.com/pytorch/pytorch/issues/150918 - continue tests on failure due to flaky tests
      - patches/0007-continue-tests-on-failure.patch
      - patches/0009-use-prefix-include-for-inductor.patch
      - patches/0011-remove-DESTINATION-lib-from-CMake-install-TARGETS-di.patch             # [win]
      - patches/0014-point-include-paths-to-PREFIX-include.patch
      - patches/0015-point-lib-paths-to-PREFIX-lib.patch
      - patches/0021-fix-onednn-cuda-include.patch
      - patches/0022-force-bundled-mkldnn.patch
      - patches/0024-Allow-fbgemm_genai-to-be-assigned-to-a-Ninja-job-pool.patch    # [linux and gpu_variant == "cuda"]
      - patches/0025-extend-gcc-sve-ice-workaround-to-gcc15.patch                   # [linux and aarch64]
      # Opt-in ninja pool for torch_python (safety margin for the generated
      # binding TUs) so the rest of the build runs at full parallelism.
      - patches/0026-win-arm64-torch_python-job-pool.patch                         # [win and arm64]
      # 2.15's #200290 dropped the macOS-14 device probe but never added its macOS 15 gate,
      # so MPS reported available on macOS 13/14 and hit unguarded macOS 15 APIs.
      - patches/0027-mps-require-macOS-15-before-creating-the-MPS-device.patch   # [gpu_variant == "metal"]
  # sha256 required — without it conda-build bypasses the pbp src_cache and
  # re-downloads every run, which hits GitHub raw's HTTP 429 rate limit on
  # busy graphs (observed on win-64 py3.11/py3.14 in graph 2dd074ea).
  - url: https://raw.githubusercontent.com/pytorch/pytorch/{{ smoke_test_commit }}/.ci/pytorch/smoke_test/smoke_test.py
    folder: smoke_test
    sha256: 707b1180e6d7b48cae745623f69d684db18a9b4b5b65c84731cfb04e63339009
  # check_wheel_tags.py is a sibling helper imported by smoke_test.py since the
  # 2.12 release (smoke_test.py:13 `from check_wheel_tags import …`). Without
  # this file the win-64 pytorch test command `python ./smoke_test/smoke_test.py
  # --package torchonly` fails with ModuleNotFoundError. The helper's runtime
  # calls fall back to a "soft warn" mode when PYTORCH_FINAL_PACKAGE_DIR isn't
  # set, so it works fine on conda-installed packages.
  - url: https://raw.githubusercontent.com/pytorch/pytorch/{{ smoke_test_commit }}/.ci/pytorch/smoke_test/check_wheel_tags.py
    folder: smoke_test
    sha256: 7c2419886b6a8e9e278c1666b415ed250227167eba1b8b3ab15b11dd1c601071
  # NOTE: .gitignore (required by upstream's `setup.py clean`) now comes
  # from the git_url checkout above — no separate download needed.

build:
  number: {{ build }}
  # Split PRs (CPU+metal / cuda12.9 / cuda13.x) share this recipe and differ only
  # in this skip line (win-arm64 CUDA 13.4 is built off-CI):
  #   CPU:       skip: true  # [gpu_variant == "cuda" or py<311]
  #   cuda12.9:  skip: true  # [gpu_variant != "cuda" or cuda_compiler_version != "12.9" or py<311]
  #   cuda13.x:  skip: true  # [gpu_variant != "cuda" or cuda_compiler_version not in ("13.0", "13.4") or py<311]
  # py3.10 dropped: triton 3.9 requires python >=3.11, and upstream ships no py3.10 2.15 wheels.
  skip: true  # [gpu_variant != "cuda" or cuda_compiler_version not in ("13.0", "13.4") or py<311]
  string: gpu_cuda{{ cuda_compiler_version | replace('.', '') }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
  string: gpu_mps_h{{PKG_HASH}}_{{ PKG_BUILDNUM }}                                                   # [gpu_variant == "metal"]
  string: cpu_{{ blas_impl }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                     # [gpu_variant == "cpu"]
  detect_binary_files_with_prefix: false
  run_exports:
    - {{ pin_subpackage('libtorch', max_pin='x.x') }}
  ignore_run_exports_from:
    - python *
    - numpy *
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  ignore_run_exports:
    - python *                               
    - numpy *                               

requirements:
  # Keep this list synchronized (except for python*, numpy*) in outputs
  # We use python to build libtorch as well because it is easier
  build:
    # When you change megabuild_python, change it in build.sh as well
    - python {{ megabuild_python }}          # [megabuild and build_platform != target_platform]
    - python                                 # [not megabuild and build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy  *                               # [megabuild and build_platform != target_platform]
    - numpy                                  # [not megabuild and build_platform != target_platform]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}                    # [(gpu_variant or "").startswith("cuda")]
    - cuda-version {{ cuda_compiler_version }}  # [(gpu_variant or "").startswith("cuda")]
    - nvtx-c                                 # [(gpu_variant or "").startswith("cuda") and build_platform != target_platform]
    {% if cuda_major >= 12 %}
    # pytorch 2.13 cmake/public/cuda.cmake:159 link-resolves CUDA::cuda_driver
    # at configure time; need the driver stub in build for native too, not
    # just cross-compile.
    - cuda-driver-dev                        # [linux and (gpu_variant or "").startswith("cuda")]
    - cuda-cudart-dev                        # [build_platform != target_platform]
    - cuda-cupti-dev                         # [build_platform != target_platform]
    - cuda-nvrtc-dev                         # [build_platform != target_platform]
    - cuda-nvtx-dev                          # [build_platform != target_platform]
    - cuda-nvml-dev                          # [build_platform != target_platform]
    - cuda-profiler-api                      # [build_platform != target_platform]
    - libcublas-dev                          # [build_platform != target_platform]
    - libcufile-dev                          # [linux and build_platform != target_platform]
    - libcufft-dev                           # [build_platform != target_platform]
    - libcurand-dev                          # [build_platform != target_platform]
    - libcusolver-dev                        # [build_platform != target_platform]
    - libcusparse-dev                        # [build_platform != target_platform]
    {% endif %}
    # git is needed on ALL platforms because the source uses git_url +
    # git_rev (content-addressable; immune to GitHub asset regeneration).
    # Note on win: keep `- git` (not `msys2-git`) — msys2-git's POSIX-path
    # git.exe fails conda-build's post-build `git status` step with
    # "system cannot find the drive specified" (exit 128).
    - git
    # libgomp's strong run_export pins _openmp_mutex *_gnu, which conflicts
    # with intel-openmp's *_intel on linux+mkl — scope to non-mkl linux only.
    - libgomp   # [linux and blas_impl != "mkl"]
    # This has a strong run_export so we don't need to put it in `host` or `run`
    # We use llvm-openmp for openblas variants on osx.
    - llvm-openmp                 # [osx and not (blas_impl == "mkl")]
    # win+openblas (win-64 and win-arm64): MSVC /openmp:llvm against conda
    # llvm-openmp (libomp.dll); vcomp140 / libomp140 are not provided by any
    # conda package (anaconda-issues#13513). See bld.bat.
    - llvm-openmp                 # [win and blas_impl == "openblas"]
    - libuv     # [win]
    - cmake
    - ninja-base
    - libabseil
    # Keep libprotobuf here so that a compatibile version
    # of protobuf is installed between build and host
    - libprotobuf
    - make      # [linux]
  host:
    # GPU requirements
    - cuda-version {{ cuda_compiler_version }} # [(gpu_variant or "").startswith("cuda")]
    - nvtx-c                                   # [(gpu_variant or "").startswith("cuda")]
    {% if cuda_major < 13 %}
    - cudnn 9.17.0.29                          # [(gpu_variant or "").startswith("cuda")]
    - nccl 2.29.3.1                            # [(gpu_variant or "").startswith("cuda") and linux]
    {% else %}
    - cudnn                  # [(gpu_variant or "").startswith("cuda")]
    - nccl {{ nccl }}           # [(gpu_variant or "").startswith("cuda") and linux]
    {% endif %}
    # libtorch compiles the CUDA linear-algebra code (BatchLinearAlgebra.cpp),
    # so magma must be in THIS host env. It was dropped here in 7a8c95e, and
    # every CUDA build since configured "MAGMA not found. Compiling without
    # MAGMA support", while run still pinned magma via pin_compatible below.
    - magma                  # [(gpu_variant or "").startswith("cuda")]
    {% if cuda_major >= 12 %}
    # cuda-driver-dev's libcuda.so stub must be in host (not just build):
    # FindCUDAToolkit searches the host prefix, and pytorch 2.13's
    # cuda.cmake link-resolves CUDA::cuda_driver at configure time.
    - cuda-driver-dev                        # [linux]
    - cuda-cudart-dev
    - cuda-cupti-dev
    - cuda-nvrtc-dev
    - cuda-nvtx-dev
    - cuda-nvml-dev
    - cuda-profiler-api
    - libcublas-dev
    - libcufile-dev                          # [linux]
    - libcufft-dev
    - libcurand-dev
    - libcusolver-dev
    - libcusparse-dev
    - cuda-cupti {{ cuda_compiler_version }}
    {% endif %}
    # other requirements
    - python {{megabuild_python}}  # [megabuild]
    - python       # [not megabuild]
    - numpy >=1.26.0,<3.0.0
    - pip
    # upstream requirements-build.txt: setuptools>=77.0.0,<82
    - setuptools >=77.0.0,<82
    - wheel
    # 2.14 migrated the build backend from setuptools to scikit-build-core
    # (pyproject.toml [build-system]). Provide it so pip's PEP-517 build uses it.
    - scikit-build-core >=1.0
    - pyyaml
    - requests
    - six
    - mkl-devel {{ mkl }}          # [blas_impl == "mkl"]
    - openblas-devel {{ openblas }}   # [blas_impl == "openblas"]
    # AR OpenMP policy (perseverance-skills/Pinnings.md):
    #   - linux+mkl/win+mkl → intel-openmp (covered below)
    #   - linux+openblas → libgomp (added here in host + run; matches
    #     suitesparse-feedstock pattern)
    #   - osx → llvm-openmp
    #   - win+openblas (win-64, win-arm64) → llvm-openmp (torch_cpu.dll links
    #     libomp; no other conda package provides it — anaconda-issues#13513)
    # Strong run_exports from each pull the correct _openmp_mutex flavor.
    - intel-openmp {{ mkl }}         # [blas_impl == "mkl"]
    - libgomp                        # [linux and blas_impl == "openblas"]
    - llvm-openmp                    # [osx and not (blas_impl == "mkl")]
    # win+openblas (win-64 and win-arm64): MSVC /openmp:llvm against conda
    # llvm-openmp (libomp.dll); vcomp140 / libomp140 are not provided by any
    # conda package (anaconda-issues#13513). See bld.bat.
    - llvm-openmp                 # [win and blas_impl == "openblas"]
    - libabseil {{ libabseil }}
    - libprotobuf {{ libprotobuf }}
    # sleef 3.9.0 OpenMP-flavor variant must match parent env's runtime to
    # avoid mismatched DT_NEEDED on torch_cpu:
    #   linux+openblas → libgomp     (AR libgcc *_gnu mutex)
    #   osx            → llvm_openmp (AR osx llvm-openmp)
    #   win or *+mkl   → no_openmp   (sleef uses parent runtime: intel-openmp
    #                                 on mkl, vcomp on win+openblas)
    - sleef 3.9.0 *libgomp*       # [linux and blas_impl != "mkl"]
    - sleef 3.9.0 *llvm_openmp*   # [osx]
    - sleef 3.9.0 *no_openmp*     # [win or blas_impl == "mkl"]
    - libuv {{ libuv }}
    - pkg-config  # [unix]
    # upstream requirements-build.txt: typing-extensions>=4.15.0
    - typing_extensions >=4.15.0
    # upstream pyproject [build-system] requires: packaging>=24.2
    - packaging >=24.2
    # upstream vendors pybind11 3.1.0 (third_party submodule); we build against
    # the system pybind11, which pybind11-abi ==11 resolves to 3.0.4. Cap at 4.0
    # for future safety. pybind11-abi pins the ABI (PKG-13552; mamba pattern).
    - pybind11 >=3.0.4,<4
    - pybind11-abi ==11     # strict — survives partial rebuilds
    - eigen {{ eigen }}
    - zlib {{ zlib }}
    - fmt {{ fmt }}
  # satisfy overlinking checks
  run:
    - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl"]
    - libgomp                                # [linux and blas_impl == "openblas"]
    - libuv                                  # [win]
    - {{ pin_compatible('magma') }}          # [(gpu_variant or "").startswith("cuda")]
    - {{ pin_compatible('libcudnn') }}          # [(gpu_variant or "").startswith("cuda")]
    - __cuda                                    # [(gpu_variant or "").startswith("cuda")]

# these tests are for the libtorch output below, but due to
# a particularity of conda-build, that output is defined in
# the global build stage, including tests
test:
  requires:
    # cmake needs a compiler to run package detection, see
    # https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
    - {{ compiler('cxx') }}
    # PKG-14712: osx-arm64 ld64/cctools test-env clobber breaks C++ stdlib
    # header lookup (cstdlib/iostream missing). Pin the c-stdlib provider
    # explicitly so the test env always has a consistent toolchain.
    - {{ stdlib('c') }}
    # for CMake config to find cuda & nvrtc
    - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
    - cuda-nvcc ={{ cuda_compiler_version }}     # [(gpu_variant or "").startswith("cuda")]
    - cuda-nvrtc-dev            # [(gpu_variant or "").startswith("cuda")]
    - cmake
    - ninja
    - pkg-config
  files:
    - cmake_test/
  commands:
    # libraries
    {% for each_lib in [ 'libc10', 'libshm', 'libtorch', 'libtorch_cpu', 'libtorch_global_deps'] %}
    - test -f $PREFIX/lib/{{ each_lib }}.so     # [linux]
    - test -f $PREFIX/lib/{{ each_lib }}.dylib  # [osx]
    {% endfor %}
    {% for each_lib in ['libc10_cuda', 'libcaffe2_nvrtc', 'libtorch_cuda', 'libtorch_cuda_linalg'] %}
    - test -f $PREFIX/lib/{{ each_lib }}.so     # [linux and (gpu_variant or "").startswith("cuda")]
    {% endfor %}
        # test integrity of CMake metadata
    - cd cmake_test
    - cmake -GNinja -DCMAKE_CXX_STANDARD=17 $CMAKE_ARGS .   # [unix]
    - cmake -GNinja -DCMAKE_CXX_STANDARD=17 %CMAKE_ARGS% .  # [win]
    # Verify dnnl.dll links Intel OpenMP (libiomp5md), not MSVC OpenMP
    # (vcomp). Eric Lundby PR #100 patches cmake/Dependencies.cmake to
    # force this; these asserts catch future regressions.
    - dumpbin /dependents "%PREFIX%\Library\bin\dnnl.dll" | findstr /i libiomp5md            # [win and blas_impl == "mkl"]
    - dumpbin /dependents "%PREFIX%\Library\bin\dnnl.dll" | findstr /i vcomp && exit /b 1 || exit /b 0  # [win and blas_impl == "mkl"]

outputs:
  - name: libtorch
    # SIR-3210/3264: post-AMI win-64, conda-build inlines bld.bat into an
    # IF-wrapper where %blas_impl% is empty, producing a 0-file libtorch
    # artifact. Per-output script forces a separate batch invocation. (unix unaffected.)
    script: build_libtorch.bat  # [win]
    build:
      missing_dso_whitelist:
        # The are dynamically loaded from %SP_DIR%\torch\lib\
        - "**/asmjit.dll"             # [win]
        - "**/c10.dll"                # [win]
        - "**/fbgemm.dll"             # [win]
        - "**/shm.dll"                # [win]
        - "**/torch_cpu.dll"          # [win]
        - "**/torch_python.dll"       # [win]
        # libcuda.so is the cuda driver API library and is a system library.
        - "**/libcuda.so*"            # [(gpu_variant or "").startswith("cuda")]
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
      overlinking_ignore_patterns:
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]

  - name: pytorch
    build:
      string: gpu_cuda{{ cuda_compiler_version | replace('.', '') }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
      string: gpu_mps_py{{ CONDA_PY }}h{{PKG_HASH}}_{{ PKG_BUILDNUM }}                                                   # [gpu_variant == "metal"]
      string: cpu_{{ blas_impl }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                     # [gpu_variant == "cpu"]
      entry_points:
        - torchrun = torch.distributed.run:main
        - torchfrtrace = torch.distributed.flight_recorder.fr_trace:main
      ignore_run_exports:             # [osx]
        - libuv                       # [osx]
      missing_dso_whitelist:
        # The are dynamically loaded from %SP_DIR%\torch\lib\
        - "**/asmjit.dll"             # [win]
        - "**/c10.dll"                # [win]
        - "**/c10_cuda.dll"           # [win]
        - "**/fbgemm.dll"             # [win]
        - "**/shm.dll"                # [win]
        - "**/torch_cpu.dll"          # [win]
        - "**/torch_cuda.dll"         # [win]
        - "**/torch_python.dll"       # [win]
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
        - "**/libtorch_python.so*"    # [aarch64]
      overlinking_ignore_patterns:
        - "**/libtorch_cpu.so*"       # [aarch64]
        - "**/libc10.so*"             # [aarch64]
        - "**/libtorch_python.so*"    # [aarch64]
      detect_binary_files_with_prefix: false
      run_exports:
        - {{ pin_subpackage('pytorch', max_pin='x.x') }}
        - {{ pin_subpackage('libtorch', max_pin='x.x') }}
    script: build_pytorch.sh   # [unix]
    script: build_pytorch.bat  # [win]
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - numpy                                  # [build_platform != target_platform]
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - {{ compiler('cuda') }}                 # [(gpu_variant or "").startswith("cuda")]
        - nvtx-c                                 # [(gpu_variant or "").startswith("cuda") and build_platform != target_platform]
        {% if cuda_major >= 12 %}
        # pytorch 2.13 cmake/public/cuda.cmake:159 link-resolves CUDA::cuda_driver
        # at configure time; need the driver stub in build for native too.
        - cuda-driver-dev                        # [linux and (gpu_variant or "").startswith("cuda")]
        - cuda-cudart-dev                        # [build_platform != target_platform]
        - cuda-cupti-dev                         # [build_platform != target_platform]
        - cuda-nvrtc-dev                         # [build_platform != target_platform]
        - cuda-nvtx-dev                          # [build_platform != target_platform]
        - cuda-nvml-dev                          # [build_platform != target_platform]
        - cuda-profiler-api                      # [build_platform != target_platform]
        - libcublas-dev                          # [build_platform != target_platform]
        - libcufile-dev                          # [linux and build_platform != target_platform]
        - libcufft-dev                           # [build_platform != target_platform]
        - libcurand-dev                          # [build_platform != target_platform]
        - libcusolver-dev                        # [build_platform != target_platform]
        - libcusparse-dev                        # [build_platform != target_platform]
        {% endif %}
        # git is needed on ALL platforms — see libtorch build section above
        # (do NOT use msys2-git on win; conda-build invocation fails with it).
        - git
        # See libtorch build section above for the openmp-mutex rationale —
        # libgomp's _openmp_mutex *_gnu run_export conflicts with intel-openmp's
        # _openmp_mutex *_intel on linux+mkl.
        - libgomp   # [linux and blas_impl != "mkl"]
        # This has a strong run_export so we don't need to put it in `host` or `run`
        # We use llvm-openmp for openblas variants on osx.
        - llvm-openmp                # [osx and not (blas_impl == "mkl")]
        # win+openblas (win-64 and win-arm64): MSVC /openmp:llvm against conda
        # llvm-openmp (libomp.dll); vcomp140 / libomp140 are not provided by any
        # conda package (anaconda-issues#13513). See bld.bat.
        - llvm-openmp                 # [win and blas_impl == "openblas"]
        - cmake
        - ninja-base
        # Keep libprotobuf here so that a compatibile version
        # of protobuf is installed between build and host
        - libprotobuf
        - make      # [linux]
      host:
        # GPU requirements
        {% if cuda_major < 13 %}
        - cudnn 9.17.0.29                 # [(gpu_variant or "").startswith("cuda")]
        - nccl 2.29.3.1                   # [(gpu_variant or "").startswith("cuda") and linux]
        {% else %}
        - cudnn                           # [(gpu_variant or "").startswith("cuda")]
        - nccl {{ nccl }}                    # [(gpu_variant or "").startswith("cuda") and linux]
        {% endif %}
        # No `<2.10` cap: pytorch 2.12's AT_MAGMA_VERSION packed minor*10 and
        # #errored on magma 2.10; 2.14 packs minor*100 and only errors at >=100
        # (aten/src/ATen/native/cuda/linalg/BatchLinearAlgebra.cpp#L54-L59).
        # The cap would also conflict with libtorch's pin_compatible('magma').
        # win-arm64 only has magma 2.10 (PKG-18376).
        - magma                           # [(gpu_variant or "").startswith("cuda")]
        - nvtx-c                          # [(gpu_variant or "").startswith("cuda")]
        {% if cuda_major >= 12 %}
        # pytorch 2.13 cmake/public/cuda.cmake:159 needs CUDA::cuda_driver at
        # configure time; ship the driver stub on all linux CUDA hosts.
        - cuda-driver-dev                 # [linux and (gpu_variant or "").startswith("cuda")]
        - cuda-cudart-dev
        - cuda-cupti-dev
        - cuda-nvrtc-dev
        - cuda-nvtx-dev
        - cuda-nvml-dev
        - cuda-profiler-api
        - libcublas-dev
        - libcufile-dev                   # [linux]
        - libcufft-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - cuda-cupti {{ cuda_compiler_version }}
        {% endif %}
        # other requirements
        - python
        - numpy >=1.26.0,<3.0.0
        - pip
        # upstream requirements-build.txt: setuptools>=77.0.0,<82
        - setuptools >=77.0.0,<82
        # 2.14 build backend: scikit-build-core drives the pytorch-output
        # `pip install .` (2nd megabuild phase) too, so it must be in this
        # multi-output host as well — not just libtorch's.
        - scikit-build-core >=1.0
        - wheel
        - pyyaml
        - requests
        - six
        - mkl-devel {{ mkl }}             # [blas_impl == "mkl"]
        - openblas-devel {{ openblas }}   # [blas_impl == "openblas"]
        # AR OpenMP policy — see libtorch host above for the full breakdown.
        - intel-openmp {{ mkl }}      # [blas_impl == "mkl"]
        - libgomp                     # [linux and blas_impl == "openblas"]
        - llvm-openmp                 # [osx and not (blas_impl == "mkl")]
        # win+openblas (win-64 and win-arm64): MSVC /openmp:llvm against conda
        # llvm-openmp (libomp.dll); vcomp140 / libomp140 are not provided by any
        # conda package (anaconda-issues#13513). See bld.bat.
        - llvm-openmp                 # [win and blas_impl == "openblas"]
        - libabseil {{ libabseil }}
        - libprotobuf {{ libprotobuf }}
        # sleef: see libtorch host above for the 3.9.0 variant-matching rationale.
        - sleef 3.9.0 *libgomp*       # [linux and blas_impl != "mkl"]
        - sleef 3.9.0 *llvm_openmp*   # [osx]
        - sleef 3.9.0 *no_openmp*     # [win or blas_impl == "mkl"]
        - libuv {{ libuv }}
        - pkg-config  # [unix]
        # upstream requirements-build.txt: typing-extensions>=4.15.0
        - typing_extensions >=4.15.0
        # upstream pyproject [build-system] requires: packaging>=24.2
        - packaging >=24.2
        - {{ pin_subpackage('libtorch', exact=True) }}
        # system pybind11 (pybind11-abi ==11 → 3.0.4); see the libtorch host above.
        - pybind11 >=3.0.4,<4
        - pybind11-abi ==11     # strict — survives partial rebuilds
        - eigen {{ eigen }}
        - zlib {{ zlib }}
        - fmt {{ fmt }}
      run:
        - {{ pin_compatible('intel-openmp') }}   # [blas_impl == "mkl"]
        - libgomp                                # [linux and blas_impl == "openblas"]
        - llvm-openmp                            # [osx and not (blas_impl == "mkl")]
        # win+openblas (win-64 and win-arm64): MSVC /openmp:llvm against conda
        # llvm-openmp (libomp.dll); vcomp140 / libomp140 are not provided by any
        # conda package (anaconda-issues#13513). See bld.bat.
        - llvm-openmp                 # [win and blas_impl == "openblas"]
        # GPU requirements without run_exports
        - {{ pin_compatible('libcudnn') }}          # [(gpu_variant or "").startswith("cuda")]
        # other requirements
        - python
        - numpy >=1.24.0,<3.0.0
        # upstream tools/metadata/dependencies.py BASE_DEPENDENCIES
        - typing_extensions >=4.13.0
        # To stop the compiler pulling in an openmp implementation itself (although I'm not sure this mutex works anyway)
        - _openmp_mutex                                       # [linux]
        - {{ pin_compatible('magma') }}                       # [(gpu_variant or "").startswith("cuda")]
        # skip to 1.13.3 to avoid test failures on Windows and mac - align with 2.7.0 release requirement
        # https://github.com/pytorch/pytorch/pull/133235
        - sympy >=1.13.3
        - filelock
        - jinja2
        - networkx >=2.5.1
        - optree >=0.13.0
        - nomkl                 # [blas_impl != "mkl"]
        - fsspec >=0.8.5
        # torch.compile's GPU backend; exercised by the inductor tests in pytorch-tests.
        - triton =={{ triton }}       # [(gpu_variant or "").startswith("cuda") and (linux and x86_64)]
        # upstream Linux CUDA wheels require cuda-bindings (.github/scripts/generate_binary_build_matrix.py);
        # needed for GreenContext, CUDA-graph annotations and managed memory.
        - cuda-bindings >=12.9.4,<13  # [linux and py<315 and (gpu_variant or "").startswith("cuda") and cuda_compiler_version.startswith("12.")]
        - cuda-bindings >=13.0.3,<14  # [linux and py<315 and (gpu_variant or "").startswith("cuda") and cuda_compiler_version.startswith("13.")]
        - {{ pin_subpackage('libtorch', exact=True) }}
        # upstream tools/metadata/dependencies.py runtime floor: setuptools>=77.0.3
        # (requirements-build.txt's <82 cap is build-time only; kept in host)
        - setuptools >=77.0.3
      run_constrained:
        # current intel-openmp builds are incompatible with llvm-openmp on osx-64
        - llvm-openmp <0a0                # [(blas_impl == "mkl") and (osx and x86_64)]
        # upstream optional extra [project.optional-dependencies]: opt-einsum>=3.3
        - opt_einsum >=3.3

    test:
      requires:
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        # PKG-14712: pin the c-stdlib provider so osx-arm64 test env has
        # consistent C++ stdlib headers (cstdlib/iostream) — works around
        # ld64/cctools clobber observed during pytorch QS env testing.
        - {{ stdlib('c') }}
        # PKG-15465: heavy pytest deps (boto3 / hypothesis / scipy / pytest-* /
        # ninja / pybind11 / binutils / cuda-driver-dev) moved to the new
        # pytorch-tests output below, together with run_test.py --core /
        # inductor / MPS commands. The base `pytorch` output keeps only the
        # fast smoke path (imports, smoke_test.py, arch verifications,
        # DLL/lib presence) so its test env is lean.
        - pip
        # cuda-nvrtc-dev is still needed for smoke_test's
        # torch.backends.cuda.is_built assertion (triggers a dlopen).
        - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
        - cuda-version {{ cuda_compiler_version }}   # [(gpu_variant or "").startswith("cuda")]
        - cuda-nvrtc-dev            # [(gpu_variant or "").startswith("cuda")]
      imports:
        - torch
      source_files:
        - smoke_test
      commands:
        # the smoke test script takes a bunch of env variables, defined below
        - set MATRIX_GPU_ARCH_VERSION="{{ '.'.join(cuda_compiler_version.split('.')[:2]) }}"    # [(gpu_variant == "cuda") and (win)]
        - set MATRIX_GPU_ARCH_TYPE="cuda"                                                       # [(gpu_variant or "").startswith("cuda") and (win)]
        - set MATRIX_GPU_ARCH_VERSION="none"                                                    # [(gpu_variant == "cpu") and (win)]
        - set MATRIX_GPU_ARCH_TYPE="none"                                                       # [(gpu_variant == "cpu") and (win)]
        - set MATRIX_CHANNEL="defaults"                                                         # [win]
        - set MATRIX_STABLE_VERSION={{ version }}                                               # [win]
        - set MATRIX_PACKAGE_TYPE="conda"                                                       # [win]
        - set TARGET_OS="windows"                                                               # [win]
        - set OMP_NUM_THREADS=4                                                                 # [win]
        - export MATRIX_GPU_ARCH_VERSION="{{ '.'.join(cuda_compiler_version.split('.')[:2]) }}" # [(gpu_variant == "cuda") and linux]
        - export MATRIX_GPU_ARCH_VERSION="{{ MACOSX_SDK_VERSION }}"                             # [(gpu_variant == "metal")]
        - export MATRIX_GPU_ARCH_TYPE="cuda"                                                    # [(gpu_variant or "").startswith("cuda") and linux]
        - export MATRIX_GPU_ARCH_TYPE="mps"                                                     # [(gpu_variant == "metal")]
        - export MATRIX_GPU_ARCH_VERSION="none"                                                 # [(gpu_variant == "cpu") and (not win)]
        - export MATRIX_GPU_ARCH_TYPE="none"                                                    # [(gpu_variant == "cpu") and (not win)]
        - export MATRIX_CHANNEL="defaults"                                                      # [not win]
        - export MATRIX_STABLE_VERSION="{{ version }}"                                          # [not win]
        - export MATRIX_PACKAGE_TYPE="conda"                                                    # [not win]
        - export TARGET_OS="linux"                                                              # [linux]
        - export TARGET_OS="macos-arm64"                                                        # [(osx and arm64)]
        - export TARGET_OS="macos-x86_64"                                                       # [(osx and x86_64)]
        - export OMP_NUM_THREADS=4                                                              # [not win]
        # Smoke test is not supported on Windows with CUDA
        - python ./smoke_test/smoke_test.py --package torchonly  # [not (gpu_variant or "").startswith("cuda") and win]
        # PKG-15465: run_test.py --core / inductor / MPS pytest suite moved to
        # the pytorch-tests output. What remains here is the fast smoke path:
        # smoke_test.py above, arch verifications below, DLL/lib checks.
        # Run pip check so as to ensure that all pytorch packages are installed
        # https://github.com/conda-forge/pytorch-cpu-feedstock/issues/24
        - pip check
        - python -c "import torch; print(torch.__version__)"
        # We have had issues with openmp .dylibs being doubly loaded in certain cases. These two tests catch those issues
        - python -c "import torch; import numpy"
        - python -c "import numpy; import torch"
        # distributed support is enabled by default on linux; for mac, we enable it manually in build.sh
        - python -c "import torch; assert torch.distributed.is_available()"        # [linux or osx]
        # mkldnn is set in build.sh for linux/non-cuda variants
        - python -c "import torch; assert torch.backends.mkldnn.m.is_available()"  # [linux and not (gpu_variant or "").startswith("cuda")]
        # Add debug for GPU tests
        - python -c "import torch; print('CUDA is_built:', torch.backends.cuda.is_built()); assert torch.backends.cuda.is_built()"                # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('CUDA is_available:', torch.cuda.is_available()); assert torch.cuda.is_available()"                      # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('cuDNN is_available:', torch.backends.cudnn.is_available()); assert torch.backends.cudnn.is_available()" # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; print('cuDNN enabled:', torch.backends.cudnn.enabled); assert torch.backends.cudnn.enabled"                    # [(gpu_variant or "").startswith("cuda")]
        # MAGMA is a build-time flag (at::hasMAGMA); CMake silently drops it if discovery fails (PKG-18413).
        - python -c "import torch; print('MAGMA built:', torch.cuda.has_magma); assert torch.cuda.has_magma"                    # [(gpu_variant or "").startswith("cuda")]
        - python -c "import torch; assert torch.backends.mps.is_built()"           # [(gpu_variant == "metal")]
        - python -c "import torch; torch.tensor(1).to('cpu').numpy(); print('numpy support enabled!!!')"
        - test -f $PREFIX/lib/libtorch_python${SHLIB_EXT}     # [unix]
        - torchrun --help
        - torchfrtrace --help

  # PKG-15465: the heavy pytest suites and their deps live in this output (modeled on
  # conda-forge's pytorch-tests), keeping the base pytorch test env lean and under the
  # Windows 260-char path limit.
  - name: pytorch-tests
    build:
      # blas_impl in the CUDA string makes it a tracked variant var here; without it
      # mkl/openblas CUDA builds share a PKG_HASH and PBP rejects the duplicate tasks.
      string: gpu_cuda{{ cuda_compiler_version | replace('.', '') }}_{{ blas_impl }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}  # [gpu_variant == "cuda"]
      string: gpu_mps_py{{ CONDA_PY }}h{{PKG_HASH}}_{{ PKG_BUILDNUM }}                                                                   # [gpu_variant == "metal"]
      string: cpu_{{ blas_impl }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}                                                     # [gpu_variant == "cpu"]
      detect_binary_files_with_prefix: false
    requirements:
      host:
        - python
      run:
        # Match the exact pytorch build we just produced (same version + build
        # string + build_number). Users installing pytorch-tests get the same
        # pytorch back — this is a heavy-deps + test-source meta bundle.
        - {{ pin_subpackage('pytorch', exact=True) }}
    test:
      requires:
        # cmake needs a compiler to run package detection
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        # PKG-14712: pin the c-stdlib provider so osx-arm64 test env has
        # consistent C++ stdlib headers (cstdlib/iostream) — works around
        # ld64/cctools clobber observed during pytorch QS env testing.
        - {{ stdlib('c') }}
        - boto3
        - hypothesis
        # scipy needed by test_ops.py::test_numpy_ref_* on all platforms.
        # scipy 1.17 dropped py3.10, so skip on py3.10 - paired with the
        # `not test_numpy_ref` filter below.
        - scipy           # [py != 310]
        - tabulate
        - pydot
        - mock  # [linux]
        - pip
        - expecttest
        # unittest-xml-reporting provides xmlrunner
        - unittest-xml-reporting
        - pytest
        - pytest-rerunfailures
        - pytest-flakefinder
        - pytest-xdist
        # Needed for test_autograd.py::test_multi_grad_all_hooks
        # (torch.utils.cpp_extension.load_inline requires ninja).
        - ninja
        # Needed for test_autograd.py
        - pybind11 >=3.0.4,<4
        # the inductor "test_aoti_eager..." tests require objcopy
        - binutils  # [linux]
        # Triton JIT links cuda_utils.c against libcuda; use driver stubs from the env (no system /lib64 driver in many builders)
        - cuda-driver-dev  # [linux and (gpu_variant or "").startswith("cuda")]
        # Inductor/triton JIT-builds cuda_utils.c and needs cuda.h under PREFIX/targets/*/include (see triton runtime/build.py).
        # cuda-nvcc alone does not populate that tree in the test env; cuda-cudart-dev does (same as global host: for CUDA 12+).
        - {{ compiler('cuda') }}    # [(gpu_variant or "").startswith("cuda")]
        - cuda-version {{ cuda_compiler_version }}   # [(gpu_variant or "").startswith("cuda")]
        - cuda-nvcc ={{ cuda_compiler_version }}     # [(gpu_variant or "").startswith("cuda")]
        {% if cuda_major >= 12 %}
        - cuda-cudart-dev           # [(gpu_variant or "").startswith("cuda")]
        {% endif %}
        - cuda-nvrtc-dev            # [(gpu_variant or "").startswith("cuda")]
      source_files:
        - test
        # tools/ is needed to optimise test run
        # as of pytorch=2.0.0, there is a bug when trying to run tests without the tools
        - tools
        # See files needed: https://github.com/pytorch/pytorch/blob/main/test/test_ops.py#350-L351
        - aten/src/ATen/native
      commands:
        # Required (not masked): CUDA C++ compilation against the conda CUDA headers
        # (patches 0009/0014 + build.sh @CUDA_TARGET@ substitution).
        - python -c "import torch.utils.cpp_extension as e; p = e.include_paths('cuda'); print(p); assert any('targets' in x for x in p), p"   # [linux and (gpu_variant or "").startswith("cuda")]
        - python -c "from torch.utils.cpp_extension import load_inline; m = load_inline(name='cuda_hdr_smoke', cpp_sources=chr(35) + 'include <cuda_runtime_api.h>\nint ndev() { int n = 0; cudaGetDeviceCount(&n); return n; }', functions=['ndev'], with_cuda=True, verbose=True); print('cuda devices:', m.ndev())"   # [linux and (gpu_variant or "").startswith("cuda")]
        - python test/run_test.py -i inductor/test_torchinductor.py -k "test_cpu_scalar_with_gpu_tensor_cpp or test_alignment_copy_not_emitted_for_cpp_wrapper"   # [(gpu_variant or "").startswith("cuda") and (linux and x86_64)]
        # Core suites: test_torch + test_autograd are required on every variant (linux-aarch64
        # CUDA runs their CPU paths, see below); the rest of --core is informational (`|| true` / `|| exit 0`) because it
        # carries known upstream / CI-worker failures. Exclusions:
        # - complex linalg dot cases are flaky: https://github.com/pytorch/pytorch/issues/150918
        # - test_ctc_loss_cudnn_tensor*: cuDNN's CTC kernel raises a device-side assert
        #   ("CTC target label out of range"), which poisons the CUDA context for the rest of test_nn.
        # - py3.10: scipy 1.17 dropped py3.10, so test_numpy_ref_* cannot run there.
        {% set k_py310 = " and not test_numpy_ref" if CONDA_PY|int == 310 else "" %}
        {% set run_test_core_k = "not (complex and (linalg_vecdot or dot or vdot)) and not test_ctc_loss_cudnn_tensor" ~ k_py310 %}
        # linux-aarch64 CUDA: the CI GPU is an NVIDIA T4G (sm_75, g5g.8xlarge), below this
        # build's sm_80 floor (build.sh), so CUDA kernels cannot run there: the core suites run
        # with the GPU hidden. test_fb_fc_packed and the igamma tests crash that worker's
        # Graviton2 CPU with SIGILL (aborting the whole suite); deselected here, crash under investigation.
        {% set run_test_core_k_aarch64_cuda = run_test_core_k ~ " and not test_fb_fc_packed and not _igamma" %}
        # Windows: lgamma / mvlgamma / multigammaln / gammaln give non-deterministic numerical
        # differences (80-110 failures) on Intel Xeon + Windows Server since PyTorch 2.5.
        {% set run_test_core_k_win = "not ((complex and (linalg_vecdot or dot or vdot)) or lgamma or mvlgamma or multigammaln or gammaln or test_ctc_loss_cudnn_tensor)" ~ k_py310 %}
        {% set core_required = "-i test_torch test_autograd" %}
        # Explicit list: run_test.py -x is prefix-matching, so "-x test_autograd" would drop test_autograd_fallback too.
        {% set core_rest = "--core -i test_autograd_fallback test_modules test_nn test_ops test_ops_gradients test_ops_fwd_gradients test_ops_jit" %}
        - python ./test/run_test.py {{ core_required }} --continue-through-error -k "{{ run_test_core_k }}"   # [not win and not (linux and aarch64 and (gpu_variant or "").startswith("cuda"))]
        - python ./test/run_test.py {{ core_rest }} --continue-through-error -k "{{ run_test_core_k }}" || true   # [not win and not (linux and aarch64 and (gpu_variant or "").startswith("cuda"))]
        - CUDA_VISIBLE_DEVICES="" python ./test/run_test.py {{ core_required }} --continue-through-error -k "{{ run_test_core_k_aarch64_cuda }}"   # [linux and aarch64 and (gpu_variant or "").startswith("cuda")]
        - CUDA_VISIBLE_DEVICES="" python ./test/run_test.py {{ core_rest }} --continue-through-error -k "{{ run_test_core_k_aarch64_cuda }}" || true   # [linux and aarch64 and (gpu_variant or "").startswith("cuda")]
        - python ./test/run_test.py {{ core_required }} --continue-through-error -k "{{ run_test_core_k_win }}"   # [win]
        - python ./test/run_test.py {{ core_rest }} --continue-through-error -k "{{ run_test_core_k_win }}" || exit 0   # [win]
        # The inductor tests test the torch.compile backend. Using the options below avoids running distributed tests,
        # which would be run if we used the --inductor option. (Distributed tests would only be correctly run on a multi-gpu test platform,
        # which we don't have.)
        # These following tests have been disbaled due to GPU architecture needing to be very new on CI. And the others are disbled due to https://github.com/conda-forge/pytorch-cpu-feedstock/issues/380
        # this also aligns with their meta.yaml testing strategy
        {% set inductor_skips = "test_isinf_cuda" %}
        {% set inductor_skips = inductor_skips ~ " or test_donated_buffer_inplace_gpt" %}
        {% set inductor_skips = inductor_skips ~ " or test_sdpa_inference_mode_aot_compile" %}
        # "Attempt to trace generator" - upstream Dynamo bug
        {% set inductor_skips = inductor_skips ~ " or test_lite_regional_compile_flex_attention_cuda" %}
        # needs the Kineto profiler ("Legacy CUDA profiling requires use_cpu=True"); build.sh sets USE_KINETO=OFF
        {% set inductor_skips = inductor_skips ~ " or test_copy_non_blocking_is_pinned" %}
        - python test/run_test.py -i inductor/test_torchinductor.py --continue-through-error -k "not ({{ inductor_skips }})" || true   # [(gpu_variant or "").startswith("cuda") and (linux and x86_64)]
        # The PBP osx-arm64 worker has no MPS device (torch.backends.mps.is_available() is False, so
        # test_mps.py fails at import); this stays informational until an MPS-capable worker exists.
        - python -c "import torch; print('MPS is_available:', torch.backends.mps.is_available())"   # [(gpu_variant == "metal")]
        - python ./test/run_test.py --mps --continue-through-error || true                                           # [(gpu_variant == "metal")]

  # Static-name wrappers, one per (gpu_variant, openblas) pair. A single dynamic-name
  # output produced duplicate PBP test tasks (no blas_impl in its hash) and, with a
  # blas-only skip, emitted both wrappers from one variant (osx-arm64 metal failure).
  - name: pytorch-cpu
    build:
      skip: true  # [gpu_variant != "cpu" or blas_impl == "mkl"]
    requirements:
      run:
        - pytorch ={{ version }}=cpu*
    test:
      imports:
        - torch

  - name: pytorch-gpu
    build:
      skip: true  # [gpu_variant == "cpu" or blas_impl == "mkl"]
    requirements:
      # `cuda_compiler` in build has zero function for this metapackage BUT it
      # forces PBP to route the wrapper's test task to a GPU worker pool that
      # provides the `__cuda` virtual package. Without it the wrapper's test
      # env can't resolve (libtorch's `run: [__cuda]` is unsatisfiable on the
      # CPU test pool). See memory/reference_pbp-gpu-worker-routing.md.
      build:
        - {{ compiler('cuda') }}                # [gpu_variant == "cuda"]
      run:
        - pytorch ={{ version }}=gpu*
    test:
      imports:
        - torch

